<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parwah</title>
<meta name="description" content="Parwah — thoughtful daily-living comfort and safety for your parents. Coming soon.">
<style>
  :root {
    --ink: #2b2420;
    --warm: #faf6f1;
    --accent: #b4552d;
    --muted: #8a7d72;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--warm);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 34rem; }
  .mark {
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 1.25rem;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }
  .soon {
    display: inline-block;
    margin-top: 1.75rem;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    border-top: 1px solid var(--accent);
    padding-top: 0.75rem;
  }
</style>
</head>
<body>
<main>
  <div class="mark">Parwah</div>
  <h1>They took care of you.<br>Take care back.</h1>
  <p>Thoughtfully chosen comfort, stability and everyday ease for your parents — delivered with the dignity they deserve.</p>
  <div class="soon">Coming soon</div>
</main>
</body>
</html>
