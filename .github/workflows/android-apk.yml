name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Publish APK into the site (lights up the /get/ install button)
        run: |
          mkdir -p site/public/downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk site/public/downloads/parwah.apk
          git config user.name "parwah-ci"
          git config user.email "anchit.tandon@gmail.com"
          git add site/public/downloads/parwah.apk
          git commit -m "Android APK build [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
