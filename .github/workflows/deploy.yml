# Production deploy, run by GitHub rather than by hand.
#
# The Vercel git integration on this project stopped creating deployments,
# and the sandbox this repo is developed in cannot reach api.vercel.com, so
# neither side can promote a build to production on its own. This workflow
# closes that gap: every push to main runs the same gate Vercel runs, and
# only then deploys straight to production with the Vercel CLI.
#
# ONE-TIME SETUP (needed before this can run):
#   1. GitHub → repo Settings → Secrets and variables → Actions → New secret
#        VERCEL_TOKEN   — a token from vercel.com/account/tokens
#   2. GitHub org Settings → Billing — Actions is currently blocked at the
#      organisation level; every run here dies in ~3s with no steps until
#      that is settled.
# The project and org IDs below are not secret; the token is the only credential.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_yC0I2xlKsitxFcfizef9EDQl
  VERCEL_PROJECT_ID: prj_n8jIIXMHjsT9NK4AVr5I0yj6tkj4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The same gate the Vercel build runs — a red tree never reaches
      # production, and it fails here in seconds rather than mid-deploy.
      - name: Deploy gate (functions, phones, site suite, security, fn cap)
        run: bash scripts/checks.sh

      - name: Deploy to production
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > .deploy-url
          echo "Deployed: $(cat .deploy-url)"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Proves the live database and every guarded rule on what just shipped.
      - name: Verify the live deployment
        run: |
          set -e
          for i in 1 2 3 4 5; do
            body=$(curl -sS "https://parwah-hq.anchit-tandon.com/api/diag?probe=db") && break
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "Live self-test FAILED"; exit 1; }
